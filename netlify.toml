[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# URLs del sitio anterior.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/propiedades.html"
  to = "/propiedades"
  status = 301

# La ficha vieja era propiedad.html?id=<nro de Hammer>. Netlify conserva el query string y
# la ficha nueva acepta tanto el id como el número de Hammer.
[[redirects]]
  from = "/propiedad.html"
  to = "/propiedades/ficha"
  status = 301

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
